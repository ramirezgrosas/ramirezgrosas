<text x="40" y="58" font-size="38" font-weight="800" fill="url(#acu)">About Me <tspan font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji">👨‍💻</tspan></text><rect x="40" y="72" width="90" height="4" rx="2" fill="url(#acu)"/><text x="40" y="126" font-size="22" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji">🧠</text><text x="86" y="126" font-size="17.5" fill="#E6EDF3">I build AI systems end to end: LLM agents in production, plus machine learning and deep</text><text x="86" y="152" font-size="17.5" fill="#E6EDF3">learning models (CNNs, RNNs, transformers) trained from scratch.</text><text x="40" y="186" font-size="22" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji">🩺</text><text x="86" y="186" font-size="17.5" fill="#E6EDF3">My roots are in health and electronics: wearables, signal processing and embedded systems.</text><text x="40" y="220" font-size="22" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji">🚀</text><text x="86" y="220" font-size="17.5" fill="#E6EDF3">Co-founder at Vora Corporation, building Groi, a finance app with an AI financial coach.</text><text x="40" y="254" font-size="22" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji">🎓</text><text x="86" y="254" font-size="17.5" fill="#E6EDF3">Dual degree in Biomedical and Electronic Engineering, Universidad de los Andes.</text><text x="40" y="288" font-size="22" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji">🎯</text><text x="86" y="288" font-size="17.5" fill="#E6EDF3">Open to my first full-time role in AI, software or electronics.</text>
